name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Lint (ruff)
        run: ruff check app tests scripts

      - name: Type check (mypy)
        run: mypy app --ignore-missing-imports || true # non-blocking during early phases

      - name: Run tests
        env:
          VECTOR_STORE: local
          EMBEDDING_PROVIDER: local
          DATABASE_URL: sqlite:///./data/ci.db
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t multimodal-rag-api:ci -f Dockerfile .

      - name: Build frontend image
        run: docker build -t multimodal-rag-frontend:ci -f frontend/Dockerfile frontend
